
name: Build Flip Silence APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          test -f FlipSilence1.1.1.zip
          unzip -q FlipSilence1.1.1.zip -d .
          test -f FlipSilence/settings.gradle.kts
          test -f FlipSilence/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            'platforms;android-36' \
            'build-tools;36.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle --no-daemon -p FlipSilence assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flip-Silence-1.1.1-debug-APK
          path: FlipSilence/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
