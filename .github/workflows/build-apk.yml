name: Build Flip Silence APK

on:
  workflow_dispatch:
    inputs:
      archive_name:
        description: 'Nazwa archiwum ZIP w katalogu głównym repozytorium GitHub'
        required: true
        type: string
        default: 'FlipSilence1.3.2.zip'
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Extract selected project archive
        id: locate
        env:
          ARCHIVE_NAME: ${{ inputs.archive_name || 'FlipSilence1.3.2.zip' }}
        run: |
          set -euo pipefail

          if [[ -z "$ARCHIVE_NAME" ]]; then
            echo "::error::Nie podano nazwy archiwum ZIP."
            exit 1
          fi

          if [[ "$ARCHIVE_NAME" != *.zip ]]; then
            echo "::error::Podany plik nie ma rozszerzenia .zip."
            exit 1
          fi

          if [[ ! -f "$ARCHIVE_NAME" ]]; then
            echo "::error::Nie znaleziono pliku '$ARCHIVE_NAME' w katalogu głównym repozytorium."
            echo "Dostępne archiwa ZIP:"
            find . -maxdepth 1 -type f -iname '*.zip' -printf '%f\\n' || true
            exit 1
          fi

          unzip -t "$ARCHIVE_NAME"
          mkdir -p extracted-project
          unzip -q "$ARCHIVE_NAME" -d extracted-project

          SETTINGS_FILE="$(find extracted-project -type f -name settings.gradle.kts -print -quit)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            SETTINGS_FILE="$(find extracted-project -type f -name settings.gradle -print -quit)"
          fi

          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "::error::W archiwum nie znaleziono settings.gradle.kts ani settings.gradle."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Znaleziono projekt: $PROJECT_DIR"

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Flip-Silence-debug-APK
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
